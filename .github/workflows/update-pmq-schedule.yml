name: Update PMQ Schedule

on:
  # Run quarterly (1st of Jan, Apr, Jul, Oct) at 00:00 UTC
  schedule:
    - cron: '0 0 1 */3 *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch PMQ schedule
        run: npx tsx scripts/fetch-pmq-schedule.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet public/data/pmq-schedule.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/pmq-schedule.json
          git commit -m "chore: update PMQ schedule [automated]"
          git push
