<div class="game-container">
  <header class="header">
    <h1>PMQ Bingo</h1>
    <p class="subtitle">Spot the soundbites!</p>
  </header>

  @if (isLoading()) {
    <main class="main loading">
      <p>Loading phrases...</p>
    </main>
  } @else {
    <main class="main">
      <app-bingo-card />
    </main>

    <footer class="footer">
      <app-game-controls />
      <a routerLink="/phrases" class="phrases-link">Browse all phrases</a>
    </footer>
  }
</div>
