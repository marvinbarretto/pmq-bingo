<div class="controls">
  <div class="status">
    <span class="counter">{{ markedCount() }}/{{ totalCells }}</span>
    @if (hasWon()) {
      <span class="win-badge">{{ winType() | uppercase }}!</span>
    }
  </div>

  <div class="buttons">
    <button class="btn btn-primary" (click)="onNewGame()" type="button">
      New Card
    </button>
    <button class="btn btn-secondary" (click)="onShare()" type="button">
      Share
    </button>
    @if (isSpeechSupported()) {
      <button
        class="btn"
        [class.btn-listening]="isListening()"
        [class.btn-secondary]="!isListening()"
        (click)="onToggleSpeech()"
        type="button"
      >
        {{ isListening() ? 'Stop Listening' : 'Start Listening' }}
      </button>
    }
  </div>

</div>
