<div class="controls">
  <div class="status">
    <span class="counter">{{ markedCount() }}/{{ totalCells }}</span>
    @if (hasWon()) {
      <span class="win-badge">{{ winType() | uppercase }}!</span>
    }
  </div>

  <div class="buttons">
    <button class="btn btn-primary" (click)="onNewGame()" type="button">
      New Card
    </button>
    @if (shareEnabled) {
      <button class="btn btn-secondary" (click)="onShare()" type="button">
        Share
      </button>
    }
    @if (speechEnabled && isSpeechSupported()) {
      <button
        class="btn"
        [class.btn-listening]="isListening()"
        [class.btn-loading]="isModelLoading()"
        [class.btn-secondary]="!isListening() && !isModelLoading()"
        [disabled]="isModelLoading()"
        (click)="onToggleSpeech()"
        type="button"
      >
        @if (isModelLoading()) {
          Loading Model...
        } @else if (isListening()) {
          Stop Listening
        } @else {
          Start Listening
        }
      </button>
    }
  </div>

</div>
