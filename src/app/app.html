<div class="app-container">
  <header class="header">
    <h1>PMQ Bingo</h1>
  </header>

  @if (isLoading()) {
    <main class="main loading">
      <p>Loading phrases...</p>
    </main>
  } @else {
    <main class="main">
      <app-bingo-card />
    </main>

    <footer class="footer">
      <app-game-controls />
    </footer>
  }
</div>
